<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Barbellinaa</title>

  <meta
    name="description"
    content="Barbellinaa — Model and Content Creator"
  />

  <meta property="og:title" content="Barbellinaa" />
  <meta
    property="og:description"
    content="Model & Content Creator — See more of me."
  />
  <meta property="og:url" content="https://barbellinaahub.com/" />
  <meta property="og:type" content="website" />


  <meta
    property="og:image"
    content="https://barbellinaahub.com/images/Profile.png"
  />

  <link rel="canonical" href="https://barbellinaahub.com/" />

 
  <link rel="icon" href="/images/Profile.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --background-top: #ff8fc7;
      --background-middle: #d565ff;
      --background-bottom: #7047ff;

      --card-background: rgba(24, 10, 35, 0.56);
      --card-border: rgba(255, 255, 255, 0.22);

      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.78);

      --button-background: rgba(255, 255, 255, 0.94);
      --button-text: #4d1761;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background-bottom);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: "DM Sans", sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 255, 255, 0.28),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(255, 130, 216, 0.4),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          var(--background-top) 0%,
          var(--background-middle) 48%,
          var(--background-bottom) 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(38, 4, 55, 0.25) 100%
        );
      z-index: 1;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bubble {
      position: absolute;
      bottom: -180px;
      border-radius: 50%;
      opacity: 0.65;
      background:
        radial-gradient(
          circle at 30% 25%,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.16) 27%,
          rgba(255, 131, 218, 0.18) 58%,
          rgba(125, 75, 255, 0.3) 100%
        );
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        inset 0 0 18px rgba(255, 255, 255, 0.28),
        0 0 28px rgba(255, 147, 220, 0.24);
      backdrop-filter: blur(3px);
      animation:
        float-up var(--duration) linear infinite,
        sway var(--sway-duration) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .bubble::after {
      content: "";
      position: absolute;
      top: 16%;
      left: 19%;
      width: 24%;
      height: 13%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      filter: blur(2px);
      transform: rotate(-35deg);
    }

    .bubble:nth-child(1) {
      left: 4%;
      width: 76px;
      height: 76px;
      --duration: 17s;
      --sway-duration: 4s;
      --delay: -2s;
    }

    .bubble:nth-child(2) {
      left: 17%;
      width: 34px;
      height: 34px;
      --duration: 13s;
      --sway-duration: 3s;
      --delay: -8s;
    }

    .bubble:nth-child(3) {
      left: 29%;
      width: 118px;
      height: 118px;
      --duration: 22s;
      --sway-duration: 6s;
      --delay: -14s;
    }

    .bubble:nth-child(4) {
      left: 43%;
      width: 52px;
      height: 52px;
      --duration: 15s;
      --sway-duration: 4.5s;
      --delay: -5s;
    }

    .bubble:nth-child(5) {
      left: 56%;
      width: 88px;
      height: 88px;
      --duration: 19s;
      --sway-duration: 5s;
      --delay: -11s;
    }

    .bubble:nth-child(6) {
      left: 69%;
      width: 42px;
      height: 42px;
      --duration: 14s;
      --sway-duration: 3.5s;
      --delay: -3s;
    }

    .bubble:nth-child(7) {
      left: 79%;
      width: 138px;
      height: 138px;
      --duration: 25s;
      --sway-duration: 6.5s;
      --delay: -17s;
    }

    .bubble:nth-child(8) {
      left: 91%;
      width: 60px;
      height: 60px;
      --duration: 18s;
      --sway-duration: 4s;
      --delay: -9s;
    }

    .bubble:nth-child(9) {
      left: 10%;
      width: 26px;
      height: 26px;
      --duration: 11s;
      --sway-duration: 3s;
      --delay: -6s;
    }

    .bubble:nth-child(10) {
      left: 62%;
      width: 28px;
      height: 28px;
      --duration: 12s;
      --sway-duration: 3s;
      --delay: -10s;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(0.88);
        opacity: 0;
      }

      8% {
        opacity: 0.62;
      }

      82% {
        opacity: 0.62;
      }

      100% {
        transform: translateY(calc(-100vh - 330px)) scale(1.08);
        opacity: 0;
      }
    }

    @keyframes sway {
      from {
        margin-left: -22px;
      }

      to {
        margin-left: 28px;
      }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    .card {
      position: relative;
      width: min(100%, 460px);
      padding: 34px 26px 28px;
      overflow: hidden;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.035)
        ),
        var(--card-background);

      border: 1px solid var(--card-border);
      border-radius: 30px;

      box-shadow:
        0 28px 80px rgba(42, 4, 68, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      top: -150px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.14);
      filter: blur(8px);
    }

    .profile-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto 20px;
      padding: 4px;
      border-radius: 50%;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 131, 218, 0.95),
          rgba(139, 91, 255, 0.95)
        );
      box-shadow:
        0 14px 35px rgba(35, 4, 57, 0.35),
        0 0 35px rgba(255, 158, 224, 0.26);
    }

    .profile-img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #32173d;
      border: 3px solid rgba(53, 14, 66, 0.65);
    }

    .status-dot {
      position: absolute;
      right: 7px;
      bottom: 10px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #65ffad;
      border: 3px solid #59216c;
      box-shadow: 0 0 13px rgba(101, 255, 173, 0.75);
    }

    h1 {
      margin: 0;
      font-family: "Unbounded", sans-serif;
      font-size: clamp(1.75rem, 7vw, 2.3rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      text-shadow: 0 6px 22px rgba(35, 3, 51, 0.36);
    }

    .handle {
      display: inline-block;
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.66);
      font-size: 0.93rem;
      font-weight: 600;
    }

    .bio {
      max-width: 340px;
      margin: 17px auto 25px;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.55;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link-button {
      position: relative;
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 48px;
      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;

      color: var(--button-text);
      background: var(--button-background);

      font-family: "DM Sans", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;

      box-shadow:
        0 12px 30px rgba(38, 3, 56, 0.23),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      transform: translateZ(0);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background-color 180ms ease;
    }

    .link-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -65%;
      width: 35%;
      height: 200%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.58);
      transform: rotate(25deg);
      transition: left 500ms ease;
    }

    .link-button::after {
      content: "›";
      position: absolute;
      right: 20px;
      top: 50%;
      color: rgba(79, 22, 98, 0.65);
      font-size: 1.65rem;
      font-weight: 500;
      transform: translateY(-53%);
      transition: transform 180ms ease;
    }

    .link-button:hover {
      transform: translateY(-3px) scale(1.012);
      background: #ffffff;
      box-shadow:
        0 17px 34px rgba(38, 3, 56, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .link-button:hover::before {
      left: 130%;
    }

    .link-button:hover::after {
      transform: translate(4px, -53%);
    }

    .link-button:active {
      transform: translateY(0) scale(0.985);
    }

    .link-button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.8);
      outline-offset: 4px;
    }

    .footer {
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.48);
      font-size: 0.75rem;
      letter-spacing: 0.03em;
    }

    @media (min-width: 768px) {
      .card {
        padding: 42px 38px 32px;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .card {
        padding: 30px 20px 25px;
        border-radius: 26px;
      }

      .profile-wrap {
        width: 116px;
        height: 116px;
      }

      .bio {
        font-size: 0.95rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble {
        animation: none;
      }

      .bubble:nth-child(-n + 5) {
        bottom: auto;
        opacity: 0.3;
      }

      .bubble:nth-child(1) {
        top: 8%;
      }

      .bubble:nth-child(2) {
        top: 28%;
      }

      .bubble:nth-child(3) {
        top: 65%;
      }

      .bubble:nth-child(4) {
        top: 48%;
      }

      .bubble:nth-child(5) {
        top: 84%;
      }

      .link-button,
      .link-button::before,
      .link-button::after {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true">
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
  </div>

  <main class="page">
    <section class="card">
      <div class="profile-wrap">
        <img
          class="profile-img"
          src="/images/Profile.png"
          alt="Barbellinaa profile picture"
        />
        <span class="status-dot" aria-hidden="true"></span>
      </div>

      <h1>Barbellinaa</h1>

      <span class="handle">@barbellinaa</span>

      <p class="bio">
        Model &amp; Content Creator<br />
        Come see more of me ♡
      </p>

      <nav class="links" aria-label="Barbellinaa links">
        <a
          class="link-button"
          href="/verification.html"
          rel="noopener noreferrer"
        >
          More of me ;)
        </a>
      </nav>

      <p class="footer">© 2026 Barbellinaa</p>
    </section>
  </main>
</body>
</html>
