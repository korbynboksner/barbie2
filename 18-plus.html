<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="robots"
    content="noindex, nofollow"
  />

  <title>Age Confirmation</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 104, 180, 0.3),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(140, 85, 255, 0.35),
          transparent 40%
        ),
        linear-gradient(
          145deg,
          #17101f,
          #301645 55%,
          #15101d
        );
    }

    .age-card {
      width: 100%;
      max-width: 440px;
      padding: 34px 28px;

      border:
        1px solid rgba(255, 255, 255, 0.18);

      border-radius: 26px;

      background:
        rgba(20, 12, 28, 0.75);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .age-icon {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;

      color: #2b1238;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #ff9bd1,
          #ba9cff
        );

      font-size: 1.5rem;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 14px;
    }

    .description {
      margin: 0 auto 22px;
      max-width: 340px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.55;
    }

    .turnstile-section {
      margin-bottom: 20px;
    }

    .turnstile-label {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .turnstile-container {
      display: flex;
      justify-content: center;
      min-height: 65px;
    }

    .age-confirmation {
      display: flex;
      align-items: flex-start;
      gap: 10px;

      margin: 20px 0;
      padding: 14px;

      text-align: left;

      border:
        1px solid rgba(255, 255, 255, 0.14);

      border-radius: 14px;
      background:
        rgba(255, 255, 255, 0.06);
    }

    .age-confirmation input {
      width: 19px;
      height: 19px;
      margin: 1px 0 0;
      accent-color: #ff9bd1;
      flex: 0 0 auto;
    }

    .age-confirmation label {
      color: rgba(255, 255, 255, 0.84);
      line-height: 1.4;
      cursor: pointer;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;

      border-radius: 15px;

      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;

      transition:
        transform 160ms ease,
        opacity 160ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .confirm-button {
      border: 0;
      color: #261131;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #ffb2da,
          #c5b1ff
        );
    }

    .confirm-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .leave-button {
      color: white;

      background:
        rgba(255, 255, 255, 0.08);

      border:
        1px solid rgba(255, 255, 255, 0.16);
    }

    .error-message {
      min-height: 22px;
      margin: 15px 0 0;
      color: #ffb5c6;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="age-card">
    <div
      class="age-icon"
      aria-hidden="true"
    >
      18+
    </div>

    <h1>Age Confirmation</h1>

    <p class="description">
      Complete the security check and confirm that
      you are at least 18 years old to continue.
    </p>

    <form id="age-form">
      <section class="turnstile-section">
        <p class="turnstile-label">
          First, complete the security check:
        </p>

        <div class="turnstile-container">
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAD2rWxL5W7TQ4MV9"
            data-theme="dark"
            data-appearance="always"
          ></div>
        </div>
      </section>

      <div class="age-confirmation">
        <input
          id="age-confirmed"
          name="age-confirmed"
          type="checkbox"
          required
        />

        <label for="age-confirmed">
          I confirm that I am at least 18 years old
          and meet the legal age requirement in my
          location.
        </label>
      </div>

      <div class="buttons">
        <button
          class="button confirm-button"
          id="confirm-button"
          type="submit"
        >
          Confirm and Continue
        </button>

        <a
          class="button leave-button"
          href="/"
        >
          Go Back
        </a>
      </div>

      <p
        class="error-message"
        id="error-message"
        role="alert"
        aria-live="polite"
      ></p>
    </form>
  </main>

  <script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer
  ></script>
  
  <script
    src="/js/age-gate.js?"
    defer
  ></script>
</body>
</html>
